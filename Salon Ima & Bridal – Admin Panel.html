<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salon Ima &amp; Bridal – Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500&display=swap">
<style>
:root{--bg:#fbf4f1;--card:#fff;--ink:#4a2d2d;--mute:#8a6a68;--rose:#c98a84;--deep:#9a5658;--gold:#c99a4b;--line:#ecd5d0;--side:#4a2d2d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1315;--card:#2d1e22;--ink:#f6e6e2;--mute:#c9a9a6;--line:#4d3439;--side:#150d0f}}
:root[data-theme="dark"]{--bg:#1d1315;--card:#2d1e22;--ink:#f6e6e2;--mute:#c9a9a6;--line:#4d3439;--side:#150d0f}
*,*:before,*:after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 Jost,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0 0 .4em;line-height:1.15}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.2rem}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
label.f{display:block;font-size:.85rem;color:var(--mute);margin:12px 0 5px}
.btn{border:0;cursor:pointer;background:linear-gradient(135deg,#d9a19b,var(--deep));color:#fff;padding:9px 18px;border-radius:30px;font-weight:500;width:auto}
.btn.o{background:none;color:var(--deep);border:1.5px solid var(--rose)}
.btn.g{background:#2f7a43}.btn.d{background:#b3392f}
.btn.s{padding:5px 13px;font-size:.85rem}
@media(prefers-color-scheme:dark){.btn.o{color:#e9b7b1}}
.muted{color:var(--mute)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;width:min(380px,100%);text-align:center}
.lbox img{width:110px;border-radius:50%;background:#fff}
.lbox form{text-align:left}
/* shell */
#app{display:none;min-height:100vh;grid-template-columns:230px 1fr}
#app.on{display:grid}
aside{background:var(--side);color:#f6e6e2;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside .brand{display:flex;align-items:center;gap:10px;font:600 1.2rem 'Cormorant Garamond',serif;margin-bottom:18px}
aside .brand img{width:42px;border-radius:50%;background:#fff}
aside button.nv{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between}
aside button.nv:hover{background:#ffffff14}
aside button.nv[aria-current=page]{background:var(--deep)}
aside .sp{flex:1}
main{padding:28px;min-width:0}
@media(max-width:800px){#app.on{display:block}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px;align-items:center}aside .brand{display:none}aside .sp{display:none}aside button.nv{white-space:nowrap}main{padding:18px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:16px 0 22px}
.stat b{display:block;font:600 2.2rem 'Cormorant Garamond',serif;color:var(--deep)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--line)}
th{font-weight:500;color:var(--mute);font-size:.85rem}
tr.cg td{background:var(--bg);font:600 1.1rem 'Cormorant Garamond',serif;color:var(--deep)}
.sc{overflow-x:auto}
td.r,th.r{text-align:right;white-space:nowrap}
/* kanban */
.kb{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));align-items:start}
.col h3{display:flex;justify-content:space-between}
.ap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;font-size:.9rem}
.ap small{display:block;color:var(--mute)}
.ap .ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:.75rem;background:#f6e3b4;color:#7a5a15;border-radius:10px;padding:1px 8px}
/* calendar */
.wk{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:6px;overflow-x:auto}
.cd{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:110px;font-size:.8rem}
.cd.t{border-color:var(--gold);border-width:2px}
.cd.o{opacity:.45}
.ev{background:#f4d8d3;color:#4a2d2d;border-radius:6px;padding:2px 6px;margin-top:4px}
.ev.b{background:#e5e0da;color:#555}
.sg{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border:1px solid var(--rose);border-radius:20px;font-size:.85rem}
.grid2{display:grid;gap:18px;grid-template-columns:1fr 1fr}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
pre{background:#2a1a1d;color:#f6d6d0;padding:14px;border-radius:12px;max-height:340px;overflow:auto;font-size:.78rem;margin:0}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);width:min(440px,92vw);padding:24px}
dialog::backdrop{background:#0006}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 20px;border-radius:30px;display:none;z-index:50}
#toast.on{display:block}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const week=s=>{const d=new Date(s+"T00:00");return addD(-((d.getDay()+6)%7),s)};
function dash(){const t=today(),w=week(t),we=addD(6,w),A=DB.appts;
 const rev=A.filter(a=>["confirmed","completed"].includes(a.status)&&a.date>=w&&a.date<=we).reduce((s,a)=>s+a.price,0);
 const td=A.filter(a=>a.date==t&&a.status=="confirmed").sort((a,b)=>a.start-b.start),pe=A.filter(a=>a.status=="pending");
 return`<h1>Good day, Imalka</h1><p class="muted">Here is how the salon looks today.</p>
 <div class="stats"><div class="card stat"><span class="muted">Today’s appointments</span><b>${td.length}</b></div><div class="card stat"><span class="muted">Pending requests</span><b>${pe.length}</b></div><div class="card stat"><span class="muted">Total revenue (this week)</span><b>${lkr(rev)}</b></div></div>
 <div class="grid2"><div class="card"><h2>Today’s schedule</h2>${td.map(a=>`<p><b>${fT(a.start)}</b> ${esc(a.name)}<small class="muted"> ${a.names.map(esc).join(", ")}</small></p>`).join("")||'<p class="muted">Nothing confirmed for today.</p>'}</div>
 <div class="card"><h2>Waiting for your reply</h2>${pe.map(a=>apCard(a)).join("")||'<p class="muted">No pending requests.</p>'}</div></div>`}
function svcV(){return`<div class="top"><div><h1>Service menu</h1><p class="muted" style="margin:0">Changes here update the website booking calculator immediately.</p></div><button class="btn" data-a="sadd">Add service</button></div>
 <div class="card sc"><table><thead><tr><th>Service</th><th class="r">Duration</th><th class="r">Price</th><th class="r">Actions</th></tr></thead><tbody>${DB.cats.map(c=>`<tr class="cg"><td colspan="4">${c}</td></tr>`+DB.services.filter(s=>s.cat==c).map(s=>`<tr><td>${esc(s.name)}</td><td class="r">${fD(s.mins)}</td><td class="r">${lkr(s.price)}</td><td class="r"><button class="btn o s" data-a="sed" data-id="${s.id}">Edit</button> <button class="btn d s" data-a="sdel" data-id="${s.id}">Delete</button></td></tr>`).join("")).join("")}</tbody></table></div>`}
function sForm(s){s=s||{cat:"Hair",name:"",price:"",mins:60};const d=$("dlg");
 d.innerHTML=`<h2>${s.id?"Edit":"Add"} service</h2><label class="f" for="fn">Service name</label><input id="fn" value="${esc(s.name)}">
 <label class="f" for="fc">Category</label><select id="fc">${DB.cats.map(c=>`<option ${c==s.cat?"selected":""}>${c}</option>`).join("")}</select>
 <label class="f" for="fp">Price (LKR)</label><input id="fp" type="number" min="0" step="100" value="${s.price}">
 <label class="f" for="fm">Duration (minutes)</label><input id="fm" type="number" min="5" step="5" value="${s.mins}">
 <div id="fe" class="muted" style="color:#b3392f;min-height:22px" role="alert"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn o" data-a="x">Cancel</button><button class="btn" data-a="ssv" data-id="${s.id||""}">Save</button></div>`;d.showModal()}
function apCard(a){const act=a.status=="pending"?`<button class="btn g s" data-a="ok" data-id="${a.id}">Approve</button><button class="btn d s" data-a="no" data-id="${a.id}">Decline</button><button class="btn o s" data-a="rs" data-id="${a.id}">Reschedule</button>`:a.status=="confirmed"?`<button class="btn g s" data-a="done" data-id="${a.id}">Mark completed</button><button class="btn o s" data-a="no" data-id="${a.id}">Cancel</button>`:"";
 return`<div class="ap"><b>${esc(a.name)}</b> ${a.rs?'<span class="tag">Rescheduled</span>':""}<small>${a.date}, ${fT(a.start)} to ${fT(a.start+a.dur)}</small><small>${a.names.map(esc).join(", ")}</small><small>${fD(a.dur)} · ${lkr(a.price)} · ${esc(a.phone)}</small>${act?`<div class="ac">${act}</div>`:""}</div>`}
function apt(){const L=[["pending","Pending"],["confirmed","Confirmed"],["completed","Completed"],["cancelled","Cancelled"]];
 return`<h1>Appointments</h1><p class="muted">Approving a request reserves the time so nobody else can book it.</p><div class="kb">${L.map(([k,l])=>{const x=DB.appts.filter(a=>a.status==k).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);return`<div class="col"><h3>${l} <span class="muted">${x.length}</span></h3>${x.map(apCard).join("")||'<p class="muted">None</p>'}</div>`}).join("")}</div>`}
function calV(){const r=cal.ref,m=cal.mode=="week";let days=[],title;
 if(m){const w=week(r);days=[...Array(7)].map((_,i)=>addD(i,w));title=days[0]+" to "+days[6]}
 else{const d=new Date(r.slice(0,7)+"-01T00:00");title=d.toLocaleString("en",{month:"long",year:"numeric"});const f=week(iso(d));const n=Math.ceil(((d.getDay()+6)%7+new Date(d.getFullYear(),d.getMonth()+1,0).getDate())/7)*7;days=[...Array(n)].map((_,i)=>addD(i,f))}
 const cells=days.map(x=>{const ev=DB.appts.filter(a=>a.date==x&&a.status=="confirmed").sort((a,b)=>a.start-b.start),bl=DB.blocks.filter(b=>b.date==x),max=m?9:2;
 return`<div class="cd ${x==today()?"t":""} ${!m&&x.slice(0,7)!=r.slice(0,7)?"o":""}"><b>${m?DAYS[new Date(x+"T00:00").getDay()].slice(0,3)+" ":""}${+x.slice(8)}</b>${bl.map(b=>`<div class="ev b">${b.all?"All day":fT(b.start)}: ${esc(b.reason)}</div>`).join("")}${ev.slice(0,max).map(a=>`<div class="ev">${fT(a.start)} ${esc(a.name)}</div>`).join("")}${ev.length>max?`<div class="muted">+${ev.length-max} more</div>`:""}</div>`}).join("");
 return`<div class="top"><h1>Calendar</h1><div class="sg"><button class="btn o s" data-a="cm" data-m="week" ${m?'aria-pressed="true"':""}>Week</button><button class="btn o s" data-a="cm" data-m="month">Month</button><button class="btn o s" data-a="cn" data-n="-1">Previous</button><button class="btn o s" data-a="cn" data-n="0">Today</button><button class="btn o s" data-a="cn" data-n="1">Next</button></div></div><h3>${title}</h3>
 <div class="wk" style="${m?"":"grid-template-columns:repeat(7,minmax(90px,1fr))"}">${cells}</div><p class="muted">Confirmed appointments are pink. Block-outs are grey.</p>`}
function set(){return`<h1>Salon settings</h1><div class="grid2"><div class="card"><h2>Business hours</h2><table><tbody>${DAYS.map((n,i)=>{const h=DB.hours[i];return`<tr><td>${n}</td><td><label><input type="checkbox" style="width:auto" data-h="${i}" data-k="closed" ${h.closed?"checked":""}> Closed</label></td><td><input type="time" aria-label="${n} opens" data-h="${i}" data-k="open" value="${toI(h.open)}" ${h.closed?"disabled":""}></td><td><input type="time" aria-label="${n} closes" data-h="${i}" data-k="close" value="${toI(h.close)}" ${h.closed?"disabled":""}></td></tr>`}).join("")}</tbody></table></div>
 <div class="card"><h2>Block-out dates and times</h2><p class="muted">Blocked times never appear as available on the website.</p>
 <label class="f" for="bd">Date</label><input id="bd" type="date" min="${today()}"><label class="f"><input id="ba" type="checkbox" style="width:auto" checked> Block the whole day</label>
 <div style="display:flex;gap:8px"><div style="flex:1"><label class="f" for="bs">From</label><input id="bs" type="time" value="12:00"></div><div style="flex:1"><label class="f" for="be">To</label><input id="be" type="time" value="13:00"></div></div>
 <label class="f" for="br">Reason</label><input id="br" placeholder="Public holiday, lunch break, time off"><div id="be2" style="color:#b3392f;min-height:22px"></div><button class="btn" data-a="badd">Add block-out</button>
 <div style="margin-top:14px">${DB.blocks.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(b=>`<p style="display:flex;justify-content:space-between;gap:8px;margin:6px 0;border-top:1px solid var(--line);padding-top:6px"><span><b>${b.date}</b> ${b.all?"All day":fT(b.start)+" to "+fT(b.end)}<small class="muted"> ${esc(b.reason)}</small></span><button class="btn o s" data-a="bdel" data-id="${b.id}">Remove</button></p>`).join("")||'<p class="muted">No block-outs.</p>'}</div></div></div>`}
function pvV(){return`<h1>Website preview</h1><p class="muted">This is the booking calculator from the main site, reading the same service data and availability rules as this panel. Edit a service or block a date and come back to see it change.</p>
 <div class="grid2"><div class="card"><h2>Booking calculator</h2>${DB.cats.map(c=>`<h3>${c}</h3>${DB.services.filter(s=>s.cat==c).map(s=>`<label style="display:flex;gap:8px;padding:4px 0"><input type="checkbox" style="width:auto" class="pc" value="${s.id}" ${pv.sel.includes(s.id)?"checked":""}>${esc(s.name)}<span class="muted" style="margin-left:auto">${fD(s.mins)} · ${lkr(s.price)}</span></label>`).join("")}`).join("")}
 <label class="f" for="pd">Date</label><input id="pd" type="date" value="${pv.date}"><div id="pr" style="margin-top:12px"></div></div>
 <div><div class="card" style="margin-bottom:18px"><h2>Mock JSON the site fetches</h2><p class="muted">GET /api/services returns this list. The calculator sums <code>price</code> and <code>mins</code>, then asks GET /api/slots?date=…&amp;mins=… for open times.</p><pre id="js"></pre></div></div></div>`}
function pvUp(){const S=pv.sel.map(svc).filter(Boolean),dur=S.reduce((a,s)=>a+s.mins,0),pr=S.reduce((a,s)=>a+s.price,0),sl=slots(pv.date,dur);
 $("pr").innerHTML=`<div class="stat"><b>${lkr(pr)}</b></div><p><b>Total duration:</b> ${fD(dur)}</p><div class="sg">${sl.map(t=>`<span class="chip">${fT(t)}</span>`).join("")||`<span class="muted">${dur?conflict(pv.date,540,dur)||"No time fits this much work that day":"Choose services to see open times"}</span>`}</div>`;
 $("js").textContent=JSON.stringify({services:DB.services.slice(0,4).map(s=>({id:s.id,category:s.cat,name:s.name,price_lkr:s.price,duration_min:s.mins})),"…":DB.services.length-4+" more",hours:DB.hours[2],blocks:DB.blocks.slice(0,2)},null,1)}
/* actions */
document.addEventListener("input",e=>{const t=e.target;
 if(t.classList.contains("pc")){pv.sel=[...document.querySelectorAll(".pc:checked")].map(x=>x.value);pvUp()}
 if(t.id=="pd"){pv.date=t.value;pvUp()}
 if(t.dataset.h!==undefined){const h=DB.hours[t.dataset.h],k=t.dataset.k;h[k]=k=="closed"?t.checked:toM(t.value||"09:00");save();if(k=="closed")render()}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id,ap=DB.appts.find(x=>x.id==id);
 if(a=="go"){V=b.dataset.v;render()}
 else if(a=="out"){location.reload()}
 else if(a=="x")$("dlg").close();
 else if(a=="sadd")sForm();
 else if(a=="sed")sForm(svc(id));
 else if(a=="sdel"){const s=svc(id);if(confirm("Delete "+s.name+"? It will disappear from the booking calculator. Past appointments keep their details.")){DB.services=DB.services.filter(x=>x.id!=id);save();render();toast("Service deleted")}}
 else if(a=="ssv"){const n=$("fn").value.trim(),p=+$("fp").value,m=+$("fm").value;if(!n||!(p>=0)||$("fp").value===""||!(m>=5))return $("fe").textContent="Enter a name, a price and a duration of at least 5 minutes.";
  const o={name:n,cat:$("fc").value,price:p,mins:m};if(id)Object.assign(svc(id),o);else DB.services.push({id:"s"+Date.now(),...o});save();$("dlg").close();render();toast("Service saved. The website calculator is updated.")}
 else if(a=="ok"){const c=conflict(ap.date,ap.start,ap.dur,ap.id);if(c)return toast("Can’t approve: "+c);ap.status="confirmed";save();render();toast("Approved. That time is now reserved.")}
 else if(a=="no"){ap.status="cancelled";save();render();toast(ap.status=="cancelled"?"Request closed":"")}
 else if(a=="done"){ap.status="completed";save();render()}
 else if(a=="rs"){$("dlg").innerHTML=`<h2>Reschedule ${esc(ap.name)}</h2><p class="muted">Pick a new time. The request stays pending until you approve it.</p><label class="f" for="rd">Date</label><input id="rd" type="date" value="${ap.date}" min="${today()}"><label class="f" for="rt">Start time</label><input id="rt" type="time" value="${toI(ap.start)}" step="1800"><div id="re" style="color:#b3392f;min-height:22px" role="alert"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn o" data-a="x">Cancel</button><button class="btn" data-a="rsv" data-id="${id}">Save new time</button></div>`;$("dlg").showModal()}
 else if(a=="rsv"){const d=$("rd").value,t=toM($("rt").value||"0:0"),c=conflict(d,t,ap.dur,ap.id);if(c)return $("re").textContent=c+". Try another time.";ap.date=d;ap.start=t;ap.rs=true;save();$("dlg").close();render();toast("New time saved. Tell the client by phone or WhatsApp.")}
 else if(a=="cm"){cal.mode=b.dataset.m;render()}
 else if(a=="cn"){const n=+b.dataset.n;cal.ref=n==0?today():cal.mode=="week"?addD(7*n,cal.ref):(()=>{const d=new Date(cal.ref.slice(0,7)+"-01T00:00");d.setMonth(d.getMonth()+n);return iso(d)})();render()}
 else if(a=="badd"){const d=$("bd").value,all=$("ba").checked,s=toM($("bs").value||"0:0"),en=toM($("be").value||"0:0");if(!d)return $("be2").textContent="Choose a date.";if(!all&&en<=s)return $("be2").textContent="The end time must be after the start time.";DB.blocks.push({id:Date.now(),date:d,all,start:s,end:en,reason:$("br").value.trim()||"Blocked"});save();render();toast("Block-out added")}
 else if(a=="bdel"){DB.blocks=DB.blocks.filter(x=>x.id!=id);save();render()}});
document.addEventListener("change",e=>{if(e.target.id=="ba")$("bs").disabled=$("be").disabled=e.target.checked});
</script>
</body>
</html>
